spring.application.name=pcbuilder
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:pcbuilder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jackson.serialization.indent-output=true
app.demo-key.pcstart=${PCSTART_DEMO_KEY:pcstart-demo-key}
app.demo-key.buildlab=${BUILDLAB_DEMO_KEY:buildlab-demo-key}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
